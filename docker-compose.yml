version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lyftr_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - LLM_API_KEYS=${LLM_API_KEYS:-mock_key_alpha,mock_key_beta}
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/app.db}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - ENABLE_FAILURE_SIMULATION=${ENABLE_FAILURE_SIMULATION:-true}
      - LLM_MODEL=${LLM_MODEL:-gemini/gemini-3.8-flash}
      - CACHE_TYPE=${CACHE_TYPE:-local}
      - LLM_REQUEST_TIMEOUT=${LLM_REQUEST_TIMEOUT:-20.0}
    volumes:
      - sqlite_data:/data
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8000}
    container_name: lyftr_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  sqlite_data:
    name: lyftr_sqlite_data
